name: GitHub Pages

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy-to-gh-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      # Every release updates the same gh-pages branch, so serialize deployments
      # across tags instead of allowing each tag to deploy concurrently.
      group: ${{ github.workflow }}
    defaults:
      run:
        working-directory: ./nav-app/

    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: 'nav-app/.nvmrc'
          cache: 'npm'
          cache-dependency-path: nav-app/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Build Navigator
        run: npm run build -- --configuration production,googleAnalytics --aot=false --base-href=https://mitre-attack.github.io/attack-navigator/

      - name: Download and extract Navigator v2
        uses: robinraju/release-downloader@v1.10
        with:
          repository: "mitre-attack/attack-navigator"
          tag: "v2.3.2"
          fileName: "attack-navigator-v2.zip"
          extract: true

      - name: Move v2 to output directory
        run: mv ../v2/ dist/browser/

      - name: Download and extract Navigator v3
        uses: robinraju/release-downloader@v1.10
        with:
          repository: "mitre-attack/attack-navigator"
          tag: "v3.1"
          fileName: "attack-navigator-v3.zip"
          extract: true

      - name: Move v3 to output directory
        run: mv ../v3/ dist/browser/

      - name: Copy redirects
        run: cp -r ./redirects/* ./dist/browser/

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          publish_dir: ./nav-app/dist/browser
